        <h1>Mi Cuenta - Perfil -</h1>
        <form id="perfilform" name="perfilform" method="post">
            <div class="nombrecompleto">
                <label for="nombre">Nombre y Apellidos:</label>
                <input type="text" id="nombre" name="nombre" required="true"/>
            </div>
            <div class="cargo">
                <label for="cargo">Cargo:</label>
                <input type="cargo" id="cargo" name="cargo" required="true"/>
            </div>
            <div class="proyecto">
                <label for="proyecto">Proyecto:</label>
                <input type="text" id="proyecto" name="proyecto" required="true"/>
            </div>
            <div class="horario">
                <label for="turno">Turno:</label>
                <input type="turno" id="turno" name="turno" required="true"/>
            </div>
            <div class="correo">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required="true"/>
            </div>
            <div class="clave">
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" required="true"/>
            </div>
            <div class="contenedorboton">
                <div class="botoneditar">
                    <button type="submit">Editar</button>
                </div>
                <div class="botonsalir">
                    <button type="submit">Salir</button>
                </div>     
            </div>     
        </form>
    </div>
