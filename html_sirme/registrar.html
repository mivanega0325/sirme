<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css_sirme/estiloregistrar.css">

<body>

        </header>
            <nav class="menu">

            </nav>
            <br>
    <br>
    </main>
    </div>
    <div class="titulo">

      <div class="hoy">
        <h6>Hoy</h6>
        <h3>Miércoles, 12 de Octubre de 2025</h3>
