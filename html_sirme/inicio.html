<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="/css_sirme/estiloinicio.css">
</head>
<body>
        <main class="menugeneral">
        <header class="encabezado">
            <div class="imagen">
                <img src="/css_sirme/imagenes/Reloj_SIRME.png" alt="Reloj_SIRME" width="100" height="100"/>
            </div>
    <div class="conectado">
    <h1>MV</h1>
    <h4>Maria Vanegas</h4>
  </div>
        </header>
            <nav class="menu">
                <a href="#">Inicio</a>
                <a href="#">Registrar</a>
                <a href="#">Informes</a>
                <a href="#">Soporte</a>
                <a href="#">Contacto</a>
            </nav>
    <br>
    </main>
    <div class="contenedorinicio">
       <h1>Iniciar Sesion</h1>
       <h6>Ingresa tu Correo Electronico y Contraseña</h6>
       <form id="perfilform" name="perfilform" method="post">
            <div class="correo">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required="true"/>
            </div>
            <div class="clave">
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" required="true"/>
            </div>
        <div class="botonsiguiente">
            <button onclick="window.location.href='menu.html'">Siguiente</button>
        </div>
        <div class="crear">
            <label for="crear">Aun no tienes cuenta?</label>
            <a href="cuenta.html">Crear Cuenta</a>
        </div>
        <div class="botonsalir">
            <button onclick="window.location.href='bienvenido.html'">Cerrar Sesión</button>
        </div>     
    </div>     
    </form>
      
</body>
</html>
