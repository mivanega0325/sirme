<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creacion de cuenta SIRME</title>
    <link rel="stylesheet" href="/css_sirme/estilocuenta.css">
</head>
<body>
    <main class="menugeneral">
     <header class="encabezado">
        <div class="imagen">
          <img src="/css_sirme/imagenes/Reloj_SIRME.png" alt="Reloj_SIRME" width="100" height="100"/>
        </div>
    <div class="conectado">
    <h1>MV</h1>
    <h4>Maria Vanegas</h4>
  </div>
        </header>
            <nav class="menu">
                <a href="#">Inicio</a>
                <a href="#">Registrar</a>
                <a href="#">Informes</a>
                <a href="#">Soporte</a>
                <a href="#">Contacto</a>
            </nav>
    <br>
    </main>
    <br>
    <br>
    <br>
    <div class="contenedorcuenta">
        <div class="crearcuenta">
            <h1>Creación de Cuenta</h1>
            <form id="forma" name="forma" method="post">
                <div class="nombrecompleto">
                    <label for="nombre">Nombre y Apellidos:</label>
                    <input type="text" id="nombre" name="nombre" required="true"/>
                </div>
                <br>
                <div class="cargo">
                    <label for="cargo">Cargo:</label>
                    <input type="cargo" id="cargo" name="cargo" required="true"/>
                </div>
                <br>
                <div class="proyecto">
                    <label for="proyecto">Proyecto:</label>
                    <input type="text" id="proyecto" name="proyecto" required="true"/>
                </div>
                <br>
                <div class="horario">
                    <label for="turno">Turno:</label>
                    <input type="turno" id="turno" name="turno" required="true"/>
                </div>
                <br>
                <div class="correo">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required="true"/>
                </div>
                <br>
                <div class="clave">
                    <label for="contraseña">Contraseña:</label>
                    <input type="password" id="contraseña" name="contraseña" required="true"/>
                </div>
                <br>
                <div class="botoncrear">
                    <button onclick="window.location.href='inicio.html'">Crear</button>
                </div>     
                
            </form>
        </div>
    </div>
</body>
</html>
